<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chestionar Finanțare 2026 — Motor de Potrivire</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0e; --surface: #111318; --surface2: #181c24;
    --border: rgba(255,255,255,0.07); --text: #e8ecf4; --muted: #5a6478;
    --accent: #4f9cf9; --accent-dim: rgba(79,156,249,0.12);
    --green: #34d399; --green-dim: rgba(52,211,153,0.12);
    --red: #f87171; --red-dim: rgba(248,113,113,0.1);
    --amber: #fbbf24; --amber-dim: rgba(251,191,36,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.6; min-height: 100vh; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px); background-size: 48px 48px; pointer-events: none; z-index: 0; }
  .app { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 32px 24px 80px; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .logo-name { font-family: 'DM Serif Display', serif; font-size: 22px; letter-spacing: -0.3px; }
  .logo-tag { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .step-indicator { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); white-space: nowrap; }

  .progress-track { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-bottom: 32px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); width: 0%; }

  .intro { animation: fadeIn 0.4s ease; }
  .intro-title { font-family: 'DM Serif Display', serif; font-size: 32px; line-height: 1.2; margin-bottom: 14px; }
  .intro-text { color: var(--muted); font-size: 15px; margin-bottom: 10px; }
  .intro-list { color: var(--muted); font-size: 14px; margin: 18px 0 28px; padding-left: 4px; list-style: none; }
  .intro-list li { padding: 6px 0; display: flex; gap: 10px; }
  .intro-list li::before { content: '▪'; color: var(--accent); }

  .question-card, .intro { animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .q-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
  .q-title { font-family: 'DM Serif Display', serif; font-size: 25px; line-height: 1.25; margin-bottom: 8px; }
  .q-help { font-size: 13px; color: var(--muted); margin-bottom: 26px; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option { display: flex; align-items: center; gap: 14px; padding: 17px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; cursor: pointer; transition: all 0.15s; user-select: none; }
  .option:hover { border-color: rgba(255,255,255,0.16); background: var(--surface2); transform: translateY(-1px); }
  .option.selected { border-color: var(--accent); background: var(--accent-dim); }
  .option-radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; transition: all 0.15s; position: relative; }
  .option.selected .option-radio { border-color: var(--accent); }
  .option.selected .option-radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }
  .option-text { flex: 1; font-size: 15px; }
  .option-note { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .num-input { width: 100%; padding: 17px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 18px; outline: none; transition: border-color 0.2s; }
  .num-input:focus { border-color: var(--accent); }

  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; }
  .btn { padding: 13px 28px; border-radius: 11px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; transition: all 0.18s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.16); }

  .results { animation: fadeIn 0.4s ease; }
  .results-head { text-align: center; margin-bottom: 32px; }
  .results-title { font-family: 'DM Serif Display', serif; font-size: 30px; margin-bottom: 8px; }
  .results-sub { color: var(--muted); font-size: 14px; }

  .match-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 14px; transition: all 0.2s; position: relative; overflow: hidden; }
  .match-card.best { border-color: var(--green); }
  .match-card.best::before { content: 'RECOMANDAT'; position: absolute; top: 14px; right: 0; background: var(--green); color: var(--bg); font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.1em; padding: 4px 14px 4px 10px; border-radius: 6px 0 0 6px; }
  .match-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
  .match-name { font-family: 'DM Serif Display', serif; font-size: 19px; line-height: 1.2; }
  .match-meta { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent); margin-top: 4px; }
  .match-desc { font-size: 13px; color: var(--muted); margin-top: 6px; max-width: 92%; }
  .match-score { text-align: right; flex-shrink: 0; }
  .match-score-val { font-family: 'DM Serif Display', serif; font-size: 32px; line-height: 1; }
  .match-score-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .match-bar-track { height: 6px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin: 12px 0; }
  .match-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
  .match-status { display: inline-flex; align-items: center; gap: 6px; font-family: 'DM Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
  .status-high { background: var(--green-dim); color: var(--green); }
  .status-mid { background: var(--amber-dim); color: var(--amber); }
  .status-low { background: var(--red-dim); color: var(--red); }
  .match-detail { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); display: none; }
  .match-card.expanded .match-detail { display: block; }
  .detail-section-title { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
  .detail-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
  .detail-item { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; }
  .detail-icon { flex-shrink: 0; margin-top: 2px; }
  .ok-icon { color: var(--green); } .no-icon { color: var(--red); }
  .doc-item { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: var(--text); }
  .doc-bullet { color: var(--accent); flex-shrink: 0; }
  .expand-hint { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .expand-hint:hover { color: var(--text); }

  .results-actions { display: flex; gap: 12px; margin-top: 26px; justify-content: center; flex-wrap: wrap; }
  .btn-export { display: inline-flex; align-items: center; gap: 7px; padding: 11px 20px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer; transition: all 0.18s; text-transform: uppercase; letter-spacing: 0.05em; }
  .btn-export:hover { color: var(--text); border-color: rgba(255,255,255,0.16); transform: translateY(-1px); }
  .btn-export.pdf:hover { color: var(--accent); border-color: rgba(79,156,249,0.35); }
  .btn-export svg { width: 14px; height: 14px; }

  .disclaimer { margin-top: 30px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; font-size: 12px; color: var(--muted); line-height: 1.6; }

  /* CTA block */
  .cta-block { margin-top: 28px; padding: 28px 24px; background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%); border: 1px solid var(--border); border-radius: 18px; text-align: center; }
  .cta-title { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 6px; }
  .cta-sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .cta-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .cta-btn { display: inline-flex; align-items: center; gap: 10px; padding: 15px 26px; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.18s; text-decoration: none; border: none; }
  .cta-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .cta-whatsapp { background: #25D366; color: #062b14; }
  .cta-whatsapp:hover { background: #20bd5a; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,211,102,0.25); }
  .cta-calendly { background: var(--accent); color: #fff; }
  .cta-calendly:hover { opacity: 0.92; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(79,156,249,0.25); }
  .cta-contact { margin-top: 20px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); line-height: 1.7; }
  .cta-contact strong { color: var(--text); }

  .toast { position: fixed; bottom: 32px; left: 50%; transform: translate(-50%, 10px); background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 20px; font-size: 13px; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <span class="logo-name">Finanțare 2026</span>
      <span class="logo-tag">Motor de Potrivire</span>
    </div>
    <div class="step-indicator" id="step-indicator">Start</div>
  </header>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <div id="quiz-container"></div>
  <div id="results-container"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  ÎNTREBĂRI — generale, pentru orice tip de afacere
// ════════════════════════════════════════════════════════════════════════════
const QUESTIONS = [
  { id: 'firma_status', title: 'Cu ce tip de firmă veți aplica?', help: 'Liniile de start-up cer firmă nouă; cele regionale cer firmă cu istoric.', type: 'single',
    options: [
      { value: 'noua', text: 'Firmă nouă / urmează să o înființez', note: 'Microîntreprindere fără activitate' },
      { value: 'micro', text: 'Microîntreprindere existentă', note: 'Sub 10 angajați' },
      { value: 'imm', text: 'IMM existent (mic sau mijlociu)', note: '10–249 angajați' },
      { value: 'pfa', text: 'PFA / persoană fizică (încă fără firmă)', note: 'Doar idee de afacere' },
    ] },
  { id: 'vechime', title: 'De cât timp funcționează firma?', help: 'Fondurile regionale și cele pentru IMM cer de obicei istoric financiar.', type: 'single',
    options: [
      { value: 'sub1', text: 'Sub 1 an / nu există încă' },
      { value: '1_3', text: 'Între 1 și 3 ani' },
      { value: 'peste3', text: 'Peste 3 ani' },
    ] },
  { id: 'gen', title: 'Cine este asociat majoritar / administrator?', help: 'Programul Femeia Antreprenor este dedicat firmelor conduse de femei.', type: 'single',
    options: [
      { value: 'femeie', text: 'O femeie (asociat majoritar)' },
      { value: 'barbat', text: 'Un bărbat (asociat majoritar)' },
      { value: 'mixt', text: 'Asociere mixtă' },
    ] },
  { id: 'varsta', title: 'Vârsta aplicantului principal', help: 'Start-Up Nation are un pilon dedicat tinerilor 18–30 ani.', type: 'single',
    options: [
      { value: 'foarte_tanar', text: '18 – 30 ani' },
      { value: 'tanar', text: '31 – 40 ani' },
      { value: 'matur', text: '41 – 54 ani' },
      { value: 'senior', text: '55+ ani' },
    ] },
  { id: 'domeniu', title: 'În ce domeniu se încadrează afacerea?', help: 'Domeniul (codul CAEN) determină liniile compatibile.', type: 'single',
    options: [
      { value: 'productie', text: 'Producție / industrie prelucrătoare' },
      { value: 'servicii', text: 'Servicii (inclusiv HoReCa, evenimente)' },
      { value: 'comert', text: 'Comerț' },
      { value: 'it', text: 'IT / digital / software' },
      { value: 'agro', text: 'Agricultură / procesare agro-alimentară' },
    ] },
  { id: 'investitie', title: 'Ce valoare estimați pentru investiție?', help: 'Suma totală aproximativă în LEI (echipamente, amenajări, etc.).', type: 'number', placeholder: 'ex: 250000' },
  { id: 'cofinantare', title: 'Puteți asigura cofinanțare proprie?', help: 'Fondurile regionale și cele elvețiene cer contribuție proprie de 15–60%.', type: 'single',
    options: [
      { value: 'mult', text: 'Da, peste 40% (sau am acces la credit bancar)' },
      { value: 'mediu', text: 'Da, între 15% și 40%' },
      { value: 'putin', text: 'Da, sub 15%' },
      { value: 'nu', text: 'Nu, am nevoie de finanțare ~100%' },
    ] },
  { id: 'angajari', title: 'Câte locuri de muncă noi veți crea?', help: 'Crearea de locuri de muncă este punctată la aproape toate liniile.', type: 'single',
    options: [
      { value: '0', text: 'Niciunul deocamdată' },
      { value: '1_2', text: '1 – 2 locuri de muncă' },
      { value: '3plus', text: '3 sau mai multe' },
    ] },
  { id: 'verde', title: 'Investiția include componentă verde / digitală?', help: 'Eficiență energetică, energie regenerabilă, economie circulară sau digitalizare.', type: 'single',
    options: [
      { value: 'verde', text: 'Da, în principal tehnologii verzi / eficiență energetică' },
      { value: 'digital', text: 'Da, în principal digitalizare / software' },
      { value: 'ambele', text: 'Și verde, și digital' },
      { value: 'nu', text: 'Nu, investiție clasică' },
    ] },
  { id: 'locatie', title: 'Unde va funcționa afacerea?', help: 'Regiunile mai puțin dezvoltate și zonele de tranziție justă au alocări speciale.', type: 'single',
    options: [
      { value: 'tranzitie', text: 'Județ de tranziție justă (Gorj, Hunedoara, Dolj, Galați, Mureș, Prahova)' },
      { value: 'rural', text: 'Mediu rural / oraș mic' },
      { value: 'regiune', text: 'Alt oraș (în afară de București-Ilfov)' },
      { value: 'bucuresti', text: 'București / Ilfov' },
    ] },
];

// ════════════════════════════════════════════════════════════════════════════
//  10 LINII DE FINANȚARE — actualizate 2026
// ════════════════════════════════════════════════════════════════════════════
const PROGRAMS = [
  {
    id: 'sun', name: 'Start-Up Nation (ed. IV)', meta: 'Grant până la 250.000 lei',
    desc: 'Pentru SRL nou-înființate de absolvenți ai cursurilor de antreprenoriat. Echipamente, software, dotări. Sesiune 2 așteptată în 2026.',
    docs: ['Certificat absolvire curs antreprenoriat', 'Plan de afaceri', 'Certificat înregistrare ONRC (firmă nouă)', 'Declarație de minimis', 'Proiecții financiare', 'Documente locuri de muncă'],
    score(a) {
      let s = 0; const r = [];
      if (a.firma_status === 'noua' || a.firma_status === 'pfa') { s += 35; r.push([true, 'Firmă nouă — criteriu de bază îndeplinit']); }
      else { r.push([false, 'Necesită firmă nou-înființată']); }
      if (a.vechime === 'sub1') { s += 10; r.push([true, 'Vechime sub 1 an — eligibil']); } else { r.push([false, 'Firma e prea veche']); }
      if (a.angajari === '3plus') { s += 25; r.push([true, '3+ locuri de muncă — punctaj maxim']); }
      else if (a.angajari === '1_2') { s += 15; r.push([true, '1–2 locuri de muncă']); } else { r.push([false, 'Fără angajări — punctaj redus']); }
      if (a.varsta === 'foarte_tanar') { s += 15; r.push([true, 'Aplicant 18–30 ani — pilon dedicat tinerilor']); }
      if (a.domeniu === 'productie') { s += 15; r.push([true, 'Producție — punctaj maxim pe domeniu']); }
      else if (a.domeniu === 'it' || a.domeniu === 'servicii') { s += 8; r.push([true, 'Domeniu eligibil']); }
      return { score: Math.min(s, 100), reasons: r };
    }
  },
  {
    id: 'femeia', name: 'Femeia Antreprenor', meta: 'Grant până la 200.000 lei',
    desc: 'Schemă pentru firme conduse de femei. În 2026 se implementează ediția 2024; urmăriți anunțul unei sesiuni noi pe granturi.imm.gov.ro.',
    docs: ['Act identitate asociat majoritar (femeie)', 'Plan de afaceri', 'Certificat înregistrare ONRC', 'Certificat fiscal (fără datorii ANAF)', 'Declarație de minimis', 'Proiecții financiare'],
    score(a) {
      let s = 0; const r = [];
      if (a.gen === 'femeie') { s += 45; r.push([true, 'Asociat majoritar femeie — criteriu obligatoriu îndeplinit']); }
      else { r.push([false, 'Necesită asociat majoritar femeie — neeligibil']); return { score: 0, reasons: r }; }
      if (a.firma_status === 'noua' || a.firma_status === 'micro') { s += 25; r.push([true, 'Microîntreprindere — compatibil']); }
      else if (a.firma_status === 'imm') { s += 15; r.push([true, 'IMM — acceptat parțial']); }
      if (a.angajari !== '0') { s += 18; r.push([true, 'Creare locuri de muncă — punctat']); } else { r.push([false, 'Fără angajări scade punctajul']); }
      if (a.cofinantare !== 'nu') { s += 12; r.push([true, 'Cofinanțare asigurată']); }
      return { score: Math.min(s, 100), reasons: r };
    }
  },
  {
    id: 'ecotech', name: 'SME Eco-Tech (fonduri elvețiene)', meta: 'Grant 40% (max ~267.000 lei) + credit 60%',
    desc: 'Pentru IMM din industria prelucrătoare, investiții verzi: eficiență energetică, regenerabile, economie circulară. Înscrieri 26 mai–24 iunie 2026.',
    docs: ['Etapă preliminară pe sme-ecotech.gov.ro', 'Plan de investiții verzi', 'Bilanț contabil', 'Acord credit bancar (min 60%)', 'Certificat constatator', 'Audit energetic (dacă e cazul)'],
    score(a) {
      let s = 0; const r = [];
      if (a.firma_status === 'micro' || a.firma_status === 'imm') { s += 25; r.push([true, 'IMM existent — eligibil']); }
      else { r.push([false, 'Necesită IMM existent (10–249 ang. ideal)']); }
      if (a.domeniu === 'productie') { s += 25; r.push([true, 'Industrie prelucrătoare — domeniu țintă']); }
      else { r.push([false, 'Programul vizează industria prelucrătoare']); }
      if (a.verde === 'verde' || a.verde === 'ambele') { s += 30; r.push([true, 'Componentă verde — criteriu principal']); }
      else { r.push([false, 'Necesită investiție verde / eficiență energetică']); }
      if (a.cofinantare === 'mult') { s += 20; r.push([true, 'Poate asigura creditul de 60%']); }
      else { r.push([false, 'Necesită credit bancar de min. 60%']); }
      return { score: Math.min(s, 100), reasons: r };
    }
  },
  {
    id: 'digital_reg', name: 'Digitalizare IMM (Programe Regionale)', meta: 'Grant 15.000 – 200.000 EUR',
    desc: 'Linii regionale (ex. Regiunea Centru) pentru digitalizarea firmelor: software, echipamente IT, automatizare. Lansări în 2026.',
    docs: ['Plan de digitalizare', 'Certificat constatator ONRC', 'Bilanț contabil', 'Dovada cofinanțării', 'Oferte software / echipamente IT', 'Certificat fiscal'],
    score(a) {
      let s = 0; const r = [];
      if (a.firma_status === 'micro' || a.firma_status === 'imm') { s += 25; r.push([true, 'IMM existent — eligibil']); }
      else { r.push([false, 'Necesită firmă existentă']); }
      if (a.verde === 'digital' || a.verde === 'ambele') { s += 30; r.push([true, 'Componentă de digitalizare — criteriu principal']); }
      else if (a.domeniu === 'it') { s += 20; r.push([true, 'Domeniu IT — compatibil']); }
      else { r.push([false, 'Necesită componentă de digitalizare']); }
      if (a.locatie === 'regiune' || a.locatie === 'rural' || a.locatie === 'tranzitie') { s += 20; r.push([true, 'În afara București-Ilfov — eligibil regional']); }
      else { r.push([false, 'București-Ilfov nu e acoperit de aceste apeluri']); }
      if (a.cofinantare !== 'nu') { s += 15; r.push([true, 'Cofinanțare asigurată']); }

  },
  {
    id: 'por_imm', name: 'Fonduri Regionale IMM (PR/POR)', meta: 'Grant până la ~5 mil. EUR',

  {

    desc: 'Linii pentru ferme mici, tineri fermieri și firme de procesare agro-alimentară. Cofinanțare min. 15% la unele măsuri.',
    docs: ['Plan de afaceri agricol', 'Cod CAEN agricol / procesare', 'Documente teren / spațiu', 'Bilanț (dacă există)', 'Dovada cofinanțării', 'Proiecții financiare'],
    score(a) {

      if (a.varsta === 'foarte_tanar' || a.varsta === 'tanar') { s += 20; r.push([true, 'Tânăr fermier — bonus']); }
      if (a.locatie === 'rural') { s += 15; r.push([true, 'Mediu rural — punctat']); }

  {

    score(a) {

      else { r.push([false, 'Dedicat activităților de producție']); return { score: 10, reasons: r }; }
      if (a.angajari === '3plus') { s += 25; r.push([true, '3+ locuri de muncă']); }
      else if (a.angajari === '1_2') { s += 15; r.push([true, '1–2 locuri de muncă']); }
      if (a.firma_status !== 'pfa') { s += 15; r.push([true, 'Formă juridică eligibilă']); }
      return { score: Math.min(s, 100), reasons: r };
    }
  },
  {
    id: 'comert', name: 'Comerț și Servicii', meta: 'Grant de stat (sesiune incertă 2026)',
    desc: 'Schemă pentru firme din comerț și servicii. Buget 2026 neconfirmat — de urmărit anunțurile MEDAT.',
    docs: ['Plan de afaceri', 'Cod CAEN comerț / servicii', 'Certificat înregistrare ONRC', 'Declarație de minimis', 'Proiecții financiare'],
    score(a) {
      let s = 0; const r = [];
      if (a.domeniu === 'comert' || a.domeniu === 'servicii') { s += 45; r.push([true, 'Comerț / servicii — domeniu țintă']); }
      else { r.push([false, 'Dedicat comerțului și serviciilor']); return { score: 10, reasons: r }; }
      if (a.angajari !== '0') { s += 25; r.push([true, 'Creare locuri de muncă']); }

    desc: 'Pentru întreprinderi sociale existente din 5 județe de tranziție justă. Înscrieri MySMIS până în august 2026.',
    docs: ['Atestat de întreprindere socială', 'Sediu în județ eligibil', 'Plan de afaceri social', 'Bilanț contabil', 'Documente locuri de muncă', 'Certificat fiscal'],
    score(a) {
      let s = 0; const r = [];
      if (a.locatie === 'tranzitie') { s += 40; r.push([true, 'Județ de tranziție justă — eligibil']); }
      else { r.push([false, 'Necesită sediu în județ de tranziție justă']); return { score: 5, reasons: r }; }
      if (a.firma_status === 'micro' || a.firma_status === 'imm') { s += 25; r.push([true, 'Întreprindere existentă']); }
      else { r.push([false, 'Necesită întreprindere socială existentă']); }
      if (a.angajari !== '0') { s += 25; r.push([true, 'Creare locuri de muncă — esențial pentru economie socială']); }

// ════════════════════════════════════════════════════════════════════════════
let current = -1; // -1 = intro
const answers = {};

function renderIntro() {
  document.getElementById('results-container').innerHTML = '';
  document.getElementById('step-indicator').textContent = 'Start';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('quiz-container').innerHTML = `
    <div class="intro">
      <div class="intro-title">Găsește linia de finanțare potrivită pentru afacerea ta</div>
      <div class="intro-text">Răspunde la ${QUESTIONS.length} întrebări scurte. Motorul analizează profilul tău și îl compară cu 10 linii de finanțare active sau așteptate în 2026.</div>
      <ul class="intro-list">
        <li>Clasament cu scor de potrivire pentru fiecare linie</li>
        <li>Analiză de eligibilitate pe criterii reale</li>
        <li>Lista documentelor necesare + export PDF</li>
      </ul>
      <button class="btn btn-primary" onclick="start()">Începe chestionarul →</button>
    </div>`;
}

function start() { current = 0; renderQuestion(); }

function renderQuestion() {
  const q = QUESTIONS[current];
  document.getElementById('results-container').innerHTML = '';
  document.getElementById('step-indicator').textContent = `Întrebarea ${current + 1} / ${QUESTIONS.length}`;
  document.getElementById('progress-fill').style.width = (current / QUESTIONS.length * 100) + '%';

  let optionsHTML;
  if (q.type === 'number') {
    optionsHTML = `<input type="number" class="num-input" id="num-input" placeholder="${q.placeholder || ''}" value="${answers[q.id] || ''}" oninput="answers['${q.id}']=this.value; updateNav()" />`;
  } else {
    optionsHTML = '<div class="options">' + q.options.map(o => `
      <div class="option ${answers[q.id] === o.value ? 'selected' : ''}" onclick="selectOption('${q.id}','${o.value}')">
        <div class="option-radio"></div>
        <div class="option-text">${o.text}${o.note ? `<div class="option-note">${o.note}</div>` : ''}</div>
      </div>`).join('') + '</div>';
  }

  document.getElementById('quiz-container').innerHTML = `
    <div class="question-card">
      <div class="q-num">Întrebarea ${current + 1}</div>
      <div class="q-title">${q.title}</div>
      <div class="q-help">${q.help}</div>
      ${optionsHTML}
      <div class="nav">
        <button class="btn btn-ghost" onclick="prev()">← Înapoi</button>
        <button class="btn btn-primary" id="next-btn" onclick="next()">${current === QUESTIONS.length - 1 ? 'Vezi rezultatele →' : 'Continuă →'}</button>
      </div>
    </div>`;
  updateNav();
}

function selectOption(qid, val) { answers[qid] = val; renderQuestion(); }
function updateNav() {
  const q = QUESTIONS[current];
  const btn = document.getElementById('next-btn'); if (!btn) return;
  const valid = q.type === 'number' ? (answers[q.id] && parseFloat(answers[q.id]) > 0) : !!answers[q.id];
  btn.disabled = !valid;
}
function next() { if (current < QUESTIONS.length - 1) { current++; renderQuestion(); } else { showResults(); } }
function prev() { if (current > 0) { current--; renderQuestion(); } else { current = -1; renderIntro(); } }

function computeResults() { return PROGRAMS.map(p => ({ ...p, ...p.score(answers) })).sort((a, b) => b.score - a.score); }
function statusClass(s) { return s >= 65 ? 'status-high' : s >= 40 ? 'status-mid' : 'status-low'; }
function statusText(s) { return s >= 65 ? 'Potrivire ridicată' : s >= 40 ? 'Potrivire medie' : 'Potrivire scăzută'; }
function barColor(s) { return s >= 65 ? 'var(--green)' : s >= 40 ? 'var(--amber)' : 'var(--red)'; }

function showResults() {
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('step-indicator').textContent = 'Rezultate';
  document.getElementById('quiz-container').innerHTML = '';
  const results = computeResults();

  const cards = results.map((r, i) => `
    <div class="match-card ${i === 0 && r.score >= 40 ? 'best' : ''} ${i === 0 ? 'expanded' : ''}" id="card-${r.id}">
      <div class="match-header">
        <div>
          <div class="match-name">${r.name}</div>
          <div class="match-meta">${r.meta}</div>
          <div class="match-desc">${r.desc}</div>
        </div>
        <div class="match-score">
          <div class="match-score-val" style="color:${barColor(r.score)}">${r.score}</div>
          <div class="match-score-label">/ 100</div>
        </div>
      </div>
      <div class="match-bar-track"><div class="match-bar-fill" style="width:${r.score}%;background:${barColor(r.score)}"></div></div>
      <span class="match-status ${statusClass(r.score)}">${statusText(r.score)}</span>
      <div class="expand-hint" onclick="toggleCard('${r.id}')">▾ Detalii eligibilitate & documente</div>
      <div class="match-detail">
        <div class="detail-section-title">Analiză eligibilitate</div>
        <div class="detail-list">
          ${r.reasons.map(([ok, txt]) => `<div class="detail-item"><span class="detail-icon ${ok ? 'ok-icon' : 'no-icon'}">${ok ? '✓' : '✕'}</span><span>${txt}</span></div>`).join('')}
        </div>
        <div class="detail-section-title">Documente necesare</div>
        <div class="detail-list">
          ${r.docs.map(d => `<div class="doc-item"><span class="doc-bullet">▪</span><span>${d}</span></div>`).join('')}
        </div>
      </div>
    </div>`).join('');

  const best = results[0];
  document.getElementById('results-container').innerHTML = `
    <div class="results">
      <div class="results-head">
        <div class="results-title">Rezultatul analizei</div>
        <div class="results-sub">${best.score >= 40 ? `Cea mai bună potrivire: <strong style="color:${barColor(best.score)}">${best.name}</strong>` : 'Nicio linie nu are potrivire ridicată — recomandăm consultanță individuală.'}</div>
      </div>
      ${cards}
      <div class="results-actions">
        <button class="btn-export" onclick="restart()">↺ Reîncepe</button>
        <button class="btn-export pdf" onclick="exportPDF()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          Descarcă raport PDF
        </button>
      </div>
      <div class="disclaimer">
        <strong>Notă:</strong> Estimare orientativă pe baza criteriilor generale ale liniilor de finanțare cunoscute pentru 2026. Unele programe (Microindustrializare, Comerț) au buget incert pentru sesiuni noi în 2026. Punctajele nu garantează aprobarea. Verificați ghidul solicitantului în vigoare și consultați un specialist înainte de depunere.
      </div>

      <div class="cta-block">
        <div class="cta-title">Vrei să mergem mai departe?</div>
        <div class="cta-sub">Discută rezultatul cu un specialist și pregătește dosarul corect de la început.</div>
        <div class="cta-buttons">
          <a class="cta-btn cta-whatsapp" href="${buildWhatsApp(results)}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3M12 2a10 10 0 0 0-8.6 15l-1.3 4.8 4.9-1.3A10 10 0 1 0 12 2"/></svg>
            Trimite solicitare WhatsApp
          </a>
          <a class="cta-btn cta-calendly" href="https://calendly.com/otilia-ioana96/30min" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Programează o consultație
          </a>
        </div>
        <div class="cta-contact">
          <strong>Otilia Ioana Sălășan</strong> · Administrator Dakamigos MARKT<br>
          Manager de proiect & planificare digitală a afacerii · WhatsApp: 0749 229 686
        </div>
      </div>
    </div>`;
}

const WHATSAPP_NR = '40749229686';

function buildWhatsApp(results) {
  const best = results[0];
  const top3 = results.slice(0, 3).map((r, i) => `${i + 1}. ${r.name} (${r.score}/100)`).join('\n');
  const inv = answers.investitie ? parseFloat(answers.investitie).toLocaleString('ro-RO') + ' LEI' : 'nespecificat';
  const msg =
    `Bună ziua, Otilia! Am completat chestionarul de finanțare.\n\n` +
    `Cea mai bună potrivire: ${best.name} (${best.score}/100)\n\n` +
    `Top 3 linii:\n${top3}\n\n` +
    `Investiție estimată: ${inv}\n\n` +
    `Aș dori o consultație pentru detalii.`;
  return `https://wa.me/${WHATSAPP_NR}?text=${encodeURIComponent(msg)}`;
}

function toggleCard(id) { document.getElementById('card-' + id).classList.toggle('expanded'); }
function restart() { current = -1; for (const k in answers) delete answers[k]; document.getElementById('results-container').innerHTML = ''; renderIntro(); }

let toastTimeout;
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimeout); toastTimeout = setTimeout(() => t.classList.remove('show'), 2200); }

function exportPDF() {
  if (!window.jspdf) { showToast('⚠️ Librăria PDF se încarcă, reîncercați.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const date = new Date().toLocaleDateString('ro-RO');
  const results = computeResults();
  const W = 210; let y = 0;

  doc.setFillColor(17, 19, 24); doc.rect(0, 0, W, 40, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(232, 236, 244);
  doc.text('Raport Potrivire Finantare 2026', 16, 18);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(90, 100, 120);
  doc.text('Analiza orientativa — 10 linii de finantare', 16, 25);
  doc.text('Generat: ' + date, 16, 31);

  y = 50;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(40, 40, 40);
  doc.text('Clasament linii de finantare', 16, y); y += 6;

  doc.autoTable({
    startY: y,
    head: [['#', 'Linie de finantare', 'Plafon', 'Scor', 'Potrivire']],
    body: results.map((r, i) => [i + 1, r.name, r.meta, r.score + '/100', statusText(r.score)]),
    theme: 'plain',
    styles: { font: 'helvetica', fontSize: 8, cellPadding: 3, textColor: [40, 40, 40] },
    headStyles: { fillColor: [17, 19, 24], textColor: [200, 208, 220], fontSize: 7.5, fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [245, 246, 250] },
    columnStyles: { 0: { cellWidth: 8, halign: 'center' }, 3: { halign: 'right', fontStyle: 'bold' } },
    margin: { left: 16, right: 16 },
  });
  y = doc.lastAutoTable.finalY + 12;

  results.forEach(r => {
    if (y > 235) { doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(40, 40, 40);
    doc.text(`${r.name}  —  ${r.score}/100`, 16, y); y += 4.5;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(110, 110, 110);
    const d = doc.splitTextToSize(r.meta + '. ' + r.desc, W - 32);
    doc.text(d, 16, y); y += d.length * 4 + 2;

    doc.autoTable({ startY: y, head: [['Analiza eligibilitate']], body: r.reasons.map(([ok, t]) => [(ok ? '[DA] ' : '[NU] ') + t]), theme: 'plain', styles: { font: 'helvetica', fontSize: 8, cellPadding: 2, textColor: [50, 50, 50] }, headStyles: { fillColor: [240, 242, 246], textColor: [79, 156, 249], fontSize: 7, fontStyle: 'bold' }, margin: { left: 16, right: 16 } });
    y = doc.lastAutoTable.finalY + 2;
    doc.autoTable({ startY: y, head: [['Documente necesare']], body: r.docs.map(x => ['- ' + x]), theme: 'plain', styles: { font: 'helvetica', fontSize: 8, cellPadding: 2, textColor: [50, 50, 50] }, headStyles: { fillColor: [240, 242, 246], textColor: [79, 156, 249], fontSize: 7, fontStyle: 'bold' }, margin: { left: 16, right: 16 } });
    y = doc.lastAutoTable.finalY + 9;
  });

  if (y > 255) { doc.addPage(); y = 20; }
  doc.setFont('helvetica', 'italic'); doc.setFontSize(7); doc.setTextColor(130, 130, 130);
  const disc = doc.splitTextToSize('Nota: Estimare orientativa bazata pe criterii generale pentru liniile cunoscute in 2026. Unele programe au buget incert. Nu reprezinta o garantie de aprobare. Verificati ghidul solicitantului in vigoare si consultati un specialist inainte de depunere.', W - 32);
  doc.text(disc, 16, y);

  const pages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(150, 150, 150); doc.text('Raport Potrivire Finantare 2026', 16, 290); doc.text('Pagina ' + i + ' / ' + pages, W - 16, 290, { align: 'right' }); }

  doc.save('Raport_Finantare_2026_' + date.replace(/\./g, '-') + '.pdf');
  showToast('✓ PDF exportat cu succes');
}

renderIntro();
</script>
