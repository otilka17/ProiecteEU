<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testul Dharma — Jay Shetty (Gândește ca un călugăr)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #faf5ec; --card: #ffffff; --primary: #c4622d; --secondary: #4a6c8f; --text: #141a24; --text-muted: #5f6c80; --border: #e8d5b0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Karla', sans-serif; background-color: var(--bg); color: var(--text);
        display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px;
    }
    .wrapper {
        background: var(--card); width: 100%; max-width: 500px; padding: 25px;
        border: 2px solid var(--border); box-shadow: 0 8px 24px rgba(74,108,143,0.1);
    }
    .header { text-align: center; margin-bottom: 25px; }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; }
    .subtitle { font-size: 0.75rem; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }
    .progress-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
    .progress-bar { width: 75%; height: 6px; background: var(--border); position: relative; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
    .q-box { display: none; }
    .q-box.active { display: block; }
    .q-text { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; color: var(--text); margin-bottom: 20px; line-height: 1.4; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .opt-btn {
        background: var(--bg); border: 1px solid var(--border); padding: 14px; text-align: left;
        font-family: 'Karla', sans-serif; font-size: 0.9rem; color: var(--text); cursor: pointer;
        transition: all 0.2s ease; font-weight: 500; line-height: 1.3;
    }
    .opt-btn:hover { background: var(--border); }
    .opt-btn.selected { background: var(--secondary); color: #fff; border-color: var(--secondary); }
    .footer-nav { display: flex; justify-content: space-between; margin-top: 25px; }
    .nav-btn {
        background: var(--secondary); color: #fff; border: none; padding: 10px 20px;
        font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem;
        cursor: pointer; transition: opacity 0.2s; width: 48%;
    }
    .nav-btn:hover { opacity: 0.9; }
    .nav-btn:disabled { background: #ccc !important; cursor: not-allowed; opacity: 0.6; }
    #result-box { display: none; }
    .result-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--primary); margin-bottom: 15px; text-align: center; font-weight: 900; }
    .result-card { padding: 15px; background: var(--bg); border-left: 4px solid var(--primary); margin-bottom: 15px; }
    .result-card h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--secondary); margin-bottom: 6px; }
    .result-card p { font-size: 0.88rem; line-height: 1.5; color: var(--text); }
</style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <h1>Gândește ca un călugăr</h1>
        <div class="subtitle">Testul Varnas &bull; Descoperă-ți Dharma</div>
    </div>
    
    <div id="quiz-area">
        <div class="progress-container">
            <span id="q-counter">Întrebarea 1 din 10</span>
            <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
        </div>
        <div id="dynamic-questions"></div>
        <div class="footer-nav">
            <button class="nav-btn" id="prev" onclick="move(-1)" disabled>Înapoi</button>
            <button class="nav-btn" id="next" onclick="move(1)" disabled>Înainte</button>
        </div>
    </div>

    <div id="result-box">
        <div class="result-title">Arhetipul Tău Varna</div>
        <div id="result-text"></div>
        <button class="nav-btn" style="width:100%; margin-top:15px; padding:12px;" onclick="window.location.reload()">Refă Testul</button>
    </div>
</div>

<script>
const testData = [
    { q: "1. Ce te motivează cel mai mult în activitatea ta zilnică?", a: "Să caut adevărul, să învăț continuu și să împărtășesc cunoașterea cu ceilalți.", b: "Să organizez echipe, să protejez oamenii și să am control asupra rezultatului.", c: "Să creez produse, să fac strategii de marketing, să vând sau să generat profit.", d: "Să ajut la execuție, să fiu omul de bază pe care se bazează structura în mod practic." },
    { q: "2. Într-o situație de criză majoră, care este tendința ta instinctivă?", a: "Să analizez profund cauzele și să caut înțelepciunea sau logica din spatele problemei.", b: "Să preiau imediat conducerea, să dau sarcini clare și să apăr persoanele implicate.", c: "Să caut soluția cea mai profitabilă sau inovatoare pentru a transforma criza în oportunitate.", d: "Să ofer sprijin operațional imediat, rezolvând problemele practice fără să mă pun în față." },
    { q: "3. Cum îți place cel mai mult să lucrezi în cadrul unui proiect?", a: "Independent, având libertatea totală de a explora idei și concepte profunde.", b: "Ca manager sau lider care coordonează execuția și stabilește viziunea mare.", c: "În rețea, colaborând strâns cu clienții, partenerii sau echipa de vânzări.", d: "Ca parte dintr-o structură stabilă, concentrându-mă pe calitatea muncii mele." },
    { q: "4. Ce mediu de lucru îți consumă cel mai repede energia sau te stresează?", a: "Un mediu superficial, unde se prețuiesc doar banii sau aparențele, nu calitatea ideilor.", b: "Un mediu haotic, unde nimeni nu își asumă răspunderea și deciziile sunt slabe.", c: "Un mediu rigid, birocratic, care îmi blochează creativitatea sau capacitatea de a vinde.", d: "Un mediu instabil, unde regulile și cerințele se schimbă de la o oră la alta din impuls." },
    { q: "5. Dacă ai primi o sumă mare de bani, care ar fi primul tău impuls strategic?", a: "I-aș investi în educație, cărți, cercetare sau cursuri de dezvoltare profundă.", b: "I-aș folosi pentru a extinde influența afacerii mele și a oferi protecție/siguranță familiei.", c: "I-aș rula imediat în noi linii de produse, campanii de promovare sau stocuri premium.", d: "I-aș pune în siguranță pentru stabilitatea casei, investind în optimizarea vieții practice." },
    { q: "6. Care dintre următoarele abilități consideri că este super-puterea ta?", a: "Capacitatea de a vedea esența lucrurilor și de a explica pe înțelesul tuturor ideile complexe.", b: "Curajul de a lua decizii grele sub presiune și de a gestiona riscurile macro.", c: "Creativitatea comercială: designul de brand, identificarea nișelor și arta de a negocia.", d: "Loialitatea, atenția chirurgicală la detalii în execuție și finalizarea sarcinilor dificile." },
    { q: "7. Ce tip de recunoaștere îți aduce cea mai mare satisfacție interioară?", a: "Când cineva îmi spune: 'M-ai ajutat să înțeleg lucrurile complet diferit, mi-ai schimbat mintea'.", b: "Când echipa sau partenerii mă respectă pentru corectitudinea și puterea mea de decizie.", c: "Când văd că un concept creat de mine (site, produs, meniu) se vinde masiv și e validat de piață.", d: "Când sunt apreciată ca fiind pilonul de încredere fără de care proiectul s-ar fi prăbușit." },
    { q: "8. Ce defect îți reproșezi cel mai des în momentele tale de auto-analiză?", a: "Că tind să analizez prea mult pe interior și devin prea detașată sau critică cu ceilalți.", b: "Că sunt prea impulsivă sau mândră atunci când simt că cineva îmi contestă autoritatea.", c: "Că mă plictisesc repede de detalii administrative și vreau mereu să trec la următorul proiect mare.", d: "Că accept prea multe sarcini de la alții, punându-mă uneori pe ultimul loc din datorie." },
    { q: "9. Cum vezi rolul tău în construirea brandului tău (de exemplu, Metanoia/Soul Meal)?", a: "Să fiu filosoful din spate: cel care definește valorile, conceptul profund și identitatea spirituală.", b: "Să fiu managerul de proiect: cel care controlează execuția, termenele și milestone-urile.", c: "Să fiu motorul comercial: cel care creează produsele premium, designul și atrage clienții.", d: "Să fiu specialistul de încredere: cel care se asigură că logistica și baza funcționează perfect." },
    { q: "10. Pentru tine, definiția supremă a libertății înseamnă:", a: "Să am mintea liberă de dogme și timp suficient pentru a contempla și învăța.", b: "Să am autonomie totală asupra deciziilor mele, fără directivă de la niciun șef extern.", c: "Să am independență financiară completă generată de propriile mele sisteme comerciale.", d: "Să am liniște, stabilitate și siguranța că munca mea este utilă și protejată." }
];

let currentIdx = 0;
const userAnswers = new Array(testData.length).fill(null);

function buildQuiz() {
    const holder = document.getElementById('dynamic-questions');
    testData.forEach((box, i) => {
        const qDiv = document.createElement('div');
        qDiv.className = `q-box ${i === 0 ? 'active' : ''}`;
        qDiv.id = `step-${i}`;
        qDiv.innerHTML = `
            <div class="q-text">${box.q}</div>
            <div class="options">
                <button class="opt-btn" onclick="hitOption(${i}, 'A', this)">${box.a}</button>
                <button class="opt-btn" onclick="hitOption(${i}, 'B', this)">${box.b}</button>
                <button class="opt-btn" onclick="hitOption(${i}, 'C', this)">${box.c}</button>
                <button class="opt-btn" onclick="hitOption(${i}, 'D', this)">${box.d}</button>
            </div>
        `;
        holder.appendChild(qDiv);
    });
    updateProgress();
}

function hitOption(qIdx, type, btn) {
    userAnswers[qIdx] = type;
    const allBtns = btn.parentElement.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('next').disabled = false;
}

function updateProgress() {
    document.getElementById('q-counter').innerText = `Întrebarea ${currentIdx + 1} din ${testData.length}`;
    const pct = ((currentIdx) / testData.length) * 100;
    document.getElementById('fill').style.width = `${pct}%`;
}

function move(dir) {
    document.getElementById(`step-${currentIdx}`).classList.remove('active');
    currentIdx += dir;
    
    if (currentIdx >= testData.length) {
        processDharma();
        return;
    }
    
    document.getElementById(`step-${currentIdx}`).classList.add('active');
    document.getElementById('prev').disabled = currentIdx === 0;
    document.getElementById('next').disabled = userAnswers[currentIdx] === null;
    
    updateProgress();
    if(currentIdx === testData.length - 1) {
        document.getElementById('next').innerText = "Află Dharma";
    } else {
        document.getElementById('next').innerText = "Înainte";
    }
}

function processDharma() {
    document.getElementById('quiz-area').style.display = 'none';
    const rBox = document.getElementById('result-box');
    const txt = document.getElementById('result-text');
    rBox.style.display = 'block';

    const scores = { A: 0, B: 0, C: 0, D: 0 };
    userAnswers.forEach(ans => { if(ans) scores[ans]++; });

    let main = 'A';
    if(scores.B > scores[main]) main = 'B';
    if(scores.C > scores[main]) main = 'C';
    if(scores.D > scores[main]) main = 'D';

    let title = "", desc = "", drive = "", shadow = "";

    if(main === 'A') {
        title = "GHIDUL (Inteligentul / Brahmana)";
        desc = "Ești condusă de dorința de a cunoaște, de a învăța și de a împărtăși adevărul. În business-ul tău, ești filosoful brandului. Rolul tău este să definești valorile profunde, conceptul alternativ (Metanoia) și să educi piața.";
        drive = "Cunoașterea pură, alinierea cu valorile spirituale, independența mentală.";
        shadow = "Tendința de a analiza în exces, detașarea rece de problemele practice și riscul de a te izola.";
    } else if(main === 'B') {
        title = "LIDERUL (Luptătorul / Kshatriya)";
        desc = "Ești un manager înnăscut. Iubești structura, controlul pe procese, milestone-urile și protecția celor din jur. În afacerea ta, ești cel care organizează haosul în timpi clari de livrare, apără echipa și coordonează macro.";
        drive = "Guvernanța, dreptatea, ordinea, asumarea riscurilor mari sub presiune.";
        shadow = "Impulsivitatea din mândrie atunci când autoritatea îți este pusă la îndoială și dificultatea de a delega.";
    } else if(main === 'C') {
        title = "CREATORUL (Negustorul / Vaishya)";
        desc = "Ești un alchimist comercial. Zona ta de geniu este inovația, designul de brand, marketingul strategic și identificarea oportunităților de profit (cum sunt Meniurile To-Go sau produsele gourmet scumpe). Transformi ideea în bani.";
        drive = "Creativitatea, expansiunea, interacțiunea cu oamenii, generarea de sisteme profitabile.";
        shadow = "Plictiseala rapidă în fața rutinelor administrative și tendința de a sări la următorul proiect fără a-l stabiliza pe cel curent.";
    } else {
        title = "CREATORUL DE SPRIJIN (Pilonul / Shudra)";
        desc = "Ești baza stabilă a oricărui sistem de succes. Îți place execuția impecabilă, ești atentă la detaliile logistice și ești omul pe care se bazează întreaga structură operatională atunci când restul lumii e în haos.";
        drive = "Utilitatea practică, loialitatea, finalizarea proceselor, excelența muncii bine făcute.";
        shadow = "Sindromul salvatorului: tendința de a accepta sarcinile tuturor și de a te pune pe ultimul loc, blocându-ți ascensiunea.";
    }

    txt.innerHTML = `
        <div class="result-card">
            <h3>Arhetip: ${title}</h3>
            <p>${desc}</p>
        </div>
        <div class="result-card" style="border-left-color: var(--secondary);">
            <h3>Motivația principală:</h3>
            <p>${drive}</p>
        </div>
        <div class="result-card" style="border-left-color: #5c3517;">
            <h3>Punctul vulnerabil (Unde pierzi energie):</h3>
            <p>${shadow}</p>
        </div>
        <p style="font-style:italic; font-size:0.85rem; text-align:center; margin-top:20px; color:var(--secondary);">
            "Când îți cunoști Varna, știi exact ce ai de făcut. Nu mai muncești sub prețul pieței tale interne."
        </p>
    `;
}

window.onload = buildQuiz;
</script>
</body>
</html>
