<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluarea Sinelui & Dharma — Metanoia</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --v1: #4a6c8f; --v2: #6f93b8; --c1: #faf5ec; --c2: #f2e8d0;
        --t1: #c4622d; --tx1: #141a24; --tx2: #2c3648;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Karla', sans-serif; background: var(--c1); color: var(--tx1);
        display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
    }
    .container {
        background: #fff; width: 100%; max-width: 550px; padding: 30px;
        border-radius: 0; border: 2px solid var(--c2);
        box-shadow: 0 12px 32px rgba(111,147,184,0.12);
    }
    h1 {
        font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.8rem;
        color: var(--v1); text-align: center; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
    }
    .subtitle { text-align: center; font-size: 0.85rem; color: var(--t1); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
    .progress-bar { width: 100%; height: 4px; background: var(--c2); margin-bottom: 25px; position: relative; }
    .progress-fill { height: 100%; background: var(--t1); width: 8.33%; transition: width 0.3s ease; }
    .question-box { display: none; }
    .question-box.active { display: block; animation: fadeIn 0.4s ease; }
    .question-text { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; color: var(--tx2); margin-bottom: 20px; line-height: 1.4; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option-btn {
        background: var(--c1); border: 1px solid var(--c2); padding: 16px; text-align: left;
        font-family: 'Karla', sans-serif; font-size: 0.95rem; color: var(--tx2); cursor: pointer;
        transition: all 0.2s ease; font-weight: 500; line-height: 1.4;
    }
    .option-btn:hover { background: var(--c2); border-color: var(--v2); }
    .option-btn.selected { background: var(--v1); color: #fff; border-color: var(--v1); }
    .nav-btns { display: flex; justify-content: space-between; margin-top: 30px; gap: 15px; }
    button.nav-action {
        background: var(--v2); color: #fff; border: none; padding: 12px 24px;
        font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem;
        cursor: pointer; transition: background 0.2s; width: 48%;
    }
    button.nav-action:hover { background: var(--v1); }
    button:disabled { background: #ccc !important; cursor: not-allowed; }
    #result-box { display: none; animation: fadeIn 0.5s ease; }
    .result-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--t1); margin-bottom: 15px; text-align: center; }
    .result-section { margin-bottom: 20px; padding: 15px; background: var(--c1); border-left: 3px solid var(--v1); }
    .result-section h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; margin-bottom: 8px; color: var(--v1); }
    .result-section p { font-size: 0.92rem; line-height: 1.6; color: var(--tx2); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="container">
    <h1>Metanoia</h1>
    <div class="subtitle">Evaluarea Sinelui & Dharma</div>
    
    <div id="quiz-wrapper">
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div id="questions-container"></div>
        <div class="nav-btns">
            <button class="nav-action" id="prev-btn" onclick="navigate(-1)" disabled>Înapoi</button>
            <button class="nav-action" id="next-btn" onclick="navigate(1)" disabled>Înainte</button>
        </div>
    </div>

    <div id="result-box">
        <div class="result-title">Profilul tău de Aliniere</div>
        <div id="result-content"></div>
        <button class="nav-action" style="width:100%; margin-top:20px; padding:15px;" onclick="window.location.reload()">Refă Chestionarul</button>
    </div>
</div>

<script>
const data = [
    { q: "1. Când cei apropiați îți critică planurile sau viziunea, ce se întâmplă în interiorul tău?", a: "Mă enervez, mă cert și consum energie încercând să le dovedesc că am dreptate.", b: "Tac, înghit nodul în gât și mimez că fac ca ei pentru liniște, deși pe interior fierb.", c: "Îi ascult rece, le izolez panica și îmi văd de execuție în secret, fără să le cer aprobarea." },
    { q: "2. Cum simți în profunzime momentele în care nu ai lichidități (bani) în cont?", a: "Ca pe o rușine sau un eșec personal care îmi taie temporar încrederea în mine.", b: "Ca pe o sclavie cruntă — mă obligă să accept compromisuri, medii sau oameni toxici.", c: "Ca pe o simplă problemă tehnică de cash-flow; mă enervează, dar știu exact cum să generez alții." },
    { q: "3. În relațiile de zi cu zi sau în muncă, unde simți că se află cel mai mare DEFECT al tău?", a: "Toleranța prea lungă la nesimțire: rabd și acumulez mult înainte să explodez și să tai punțile.", b: "Mândria și impulsivitatea: când mă simt călcată pe coadă, pot distruge o punte instant din orgoliu.", c: "Rigiditatea și încăpățânarea oarbă: merg înainte pe drumul meu chiar și când dau cu capul de zid." },
    { q: "4. În ce context simți că rulezi instant în 'Zona ta de Geniu' (Abilitatea Supremă)?", a: "În creație pură: design, arhitectură de brand, cod, rețete premium, adică transformarea ideii în estetică.", b: "În managementul crizelor: când e haos complet în jur, eu sunt singura care rămâne lucidă și organizează salvarea.", c: "În influență și expansiune: când conving oamenii, vând concepte și îi fac pe alții să creadă în viziune." },
    { q: "5. Ce te sperie de fapt cel mai mult când te gândești la succesul tău absolut și libertate deplină?", a: "Faptul că voi fi complet singură pe cont propriu, fără să mai am pe ce context sau fabrică să dau vina.", b: "Invidia sau izolarea: frica subconștientă că oamenii apropiați nu mă vor mai putea controla și mă vor bârfi.", c: "Nu mă sperie absolut nimic, sunt structural pregătită să îmi asum zborul total." },
    { q: "6. Cum reacționează sistemul tău nervos atunci când ești într-o stare de epuizare extremă?", a: "Devin hiperactivă și agitată: încep să fac o mie de lucruri deodată ca să fug psihic de oboseală.", b: "Clachez emoțional: plâng din detalii minore sau refulez nervos pe primul om care îmi iese în cale.", c: "Intru în modul robot: mă izolez complet, devin extrem de rece și execut mecanic doar ce e critic." },
    { q: "7. Care este capcana sau minciuna personală pe care ți-o repeți cel mai des pe post de alibi?", a: "Refugiul în viitor: 'Mai suport puțin contextul ăsta doar până strâng o sumă fixă de bani'.", b: "Sindromul salvatorului: 'Trebuie să rezolv eu problemele tuturor din jur, abia apoi am dreptul să exist eu'.", c: "Hiper-independența defensivă: 'Pot și trebuie să le fac pe toate singură, nu am nevoie și nu mă încred în nimeni'." },
    { q: "8. Ce tip de comportament te scoate instant din starea de echilibru și îți activează furia?", a: "Mediocritatea asumată: oamenii lenți, pasivi, care nu vor nimic de la viață dar se plâng continuu.", b: "Abuzul de putere: șefii incompetenți sau partenerii care încearcă să îmi dicteze mie ce am voie să fac.", c: "Falsitatea structurală: lingușitorii, măștile duble și oamenii care își schimbă caracterul după interes." },
    { q: "9. În momentul în care îți vine o idee extraordinară (un produs gourmet, o strategie nouă), ce faci?", a: "O împărtășesc rapid cu cei apropiați ca să le testez reacția, dar mă ofilesc dacă ei nu o înțeleg.", b: "O blochez în analiză: o întorc pe toate fețele din perfecționism, de frică să nu dau greș în public.", c: "Trec direct la execuție agresivă (fac codul, pun pe Insta, configurez plăți) înainte ca cineva să poată zică nu." },
    { q: "10. Care este combustibilul emoțional real care îți alimentează ambiția în momentele grele?", a: "Nevoia de validare: dorința ca valoarea și inteligența mea să fie recunoscute oficial de ceilalți.", b: "Răzbunarea constructivă: ambiția de a le demonstra celor care m-au subestimat sau controlat cine sunt eu.", c: "Autonomia radicală: dorința să nu depind niciodată de nicio dispoziție, semnătură sau portofel străin." },
    { q: "11. Cum se manifestă relația ta cu regulile sau structurile ierarhice impuse de un sistem extern?", a: "Le respect formal pentru a evita conflictele, dar îmi construiesc subtil propriile culoare de libertate.", b: "Le resping visceral: simt o nevoie nativă de a le dărâma sau sabota dacă nu le găsesc o logică perfectă.", c: "Le folosesc strategic: le învăț mecanismul perfect doar ca să le domin și să le pun să lucreze în avantajul meu." },
    { q: "12. Când priviți profund în interior, ce înseamnă de fapt conceptul de 'Misiune' (Dharma) pentru tine?", a: "Să creez structuri de frumos și calitate premium care să ridice standardul comunității din jur.", b: "Să acționez ca un pilon de putere și protecție pentru cei vulnerabili (copil, oameni dragi), fiind un scut în criză.", c: "Să cuceresc independența totală și să las în spate un sistem de business automatizat, construit de mine." }
];

let currentStep = 0;
const answers = new Array(data.length).fill(null);

function initQuiz() {
    const container = document.getElementById('questions-container');
    data.forEach((item, index) => {
        const box = document.createElement('div');
        box.className = `question-box ${index === 0 ? 'active' : ''}`;
        box.id = `q-box-${index}`;
        box.innerHTML = `
            <div class="question-text">${item.q}</div>
            <div class="options">
                <button class="option-btn" onclick="selectOption(${index}, 'A', this)">${item.a}</button>
                <button class="option-btn" onclick="selectOption(${index}, 'B', this)">${item.b}</button>
                <button class="option-btn" onclick="selectOption(${index}, 'C', this)">${item.c}</button>
            </div>
        `;
        container.appendChild(box);
    });
}

function selectOption(qIndex, option, btnElement) {
    answers[qIndex] = option;
    const buttons = btnElement.parentElement.querySelectorAll('.option-btn');
    buttons.forEach(btn => btn.classList.remove('selected'));
    btnElement.classList.add('selected');
    document.getElementById('next-btn').disabled = false;
}

function navigate(direction) {
    document.getElementById(`q-box-${currentStep}`).classList.remove('active');
    currentStep += direction;
    
    if (currentStep >= data.length) {
        showResults();
        return;
    }
    
    document.getElementById(`q-box-${currentStep}`).classList.add('active');
    document.getElementById('prev-btn').disabled = currentStep === 0;
    document.getElementById('next-btn').disabled = answers[currentStep] === null;
    
    // Update progress bar
    const progressPercent = ((currentStep + 1) / data.length) * 100;
    document.getElementById('progress').style.width = `${progressPercent}%`;
    if(currentStep === data.length - 1) {
        document.getElementById('next-btn').innerText = "Vezi Evaluarea";
    } else {
        document.getElementById('next-btn').innerText = "Înainte";
    }
}

function showResults() {
    document.getElementById('quiz-wrapper').style.display = 'none';
    const resultBox = document.getElementById('result-box');
    const content = document.getElementById('result-content');
    resultBox.style.display = 'block';

    const counts = { A: 0, B: 0, C: 0 };
    answers.forEach(ans => { if(ans) counts[ans]++; });

    let arhetip = "", dharma = "", puncteTare = "", puncteSlab = "";

    if (counts.C >= counts.A && counts.C >= counts.B) {
        arhetip = "Arhitectul Autonom (Profil Dominant Execuție & Rechin de Business)";
        dharma = "Să construiești sisteme independente de business (Metanoia/Soul Meal) bazate pe viteză și pragmatism brut, tăind dependențele emoționale.";
        puncteTare = "Viteză militară de execuție, rezistență excepțională la stres, gândire logică detașată în momente de criză monetară sau personală.";
        puncteSlab = "Hiper-independență defensivă (refuzul de a cere sau accepta ajutor), tendința de a intra în modul 'robot' și de a arde punți folositoare din mândrie radicală.";
    } else if (counts.A >= counts.B && counts.A >= counts.C) {
        arhetip = "Creatorul de Structuri Premium (Profil Estetic & Alchimist)";
        dharma = "Să ridici standardul gastronomic și vizual din Țara Hațegului prin concepte gourmet de nișă, oferind comunității produse cu identitate puternică.";
        puncteTare = "Geniu vizual, atenție chirurgicală la detalii, capacitatea nativă de a insufla valoare și preț premium unui produs simplu (design, cod, branding).";
        puncteSlab = "Dependență mascată de validare externă (sensibilitate mare când cei dragi nu înțeleg proiectul) și riscul de a consuma resurse apărând orgoliul în loc de a executa.";
    } else {
        arhetip = "Liderul de Criză & Scutul Emoțional (Profil Anchor)";
        dharma = "Să stabilizezi procese, să fii pilonul de rezistență în momentele de haos logistic sau operațional și să folosești presiunea ca pe un catalizator.";
        puncteTare = "Luciditate totală când totul în jur se prăbușește, simț de răspundere uriaș pentru cei dependenți de tine (copil, echipă) și putere de sacrificiu.";
        puncteSlab = "Sindromul salvatorului (tendința de a absorbi problemele altora pe post de bottleneck propriu), cumpărarea unei păci false prin înghițirea nodurilor în gât.";
    }

    content.innerHTML = `
        <div class="result-section">
            <h3>Arhetipul Sinelui tau:</h3>
            <p><strong>${arhetip}</strong></p>
        </div>
        <div class="result-section">
            <h3>Dharma Ta Reala (Calea):</h3>
            <p>${dharma}</p>
        </div>
        <div class="result-section">
            <h3>Punctul Tău Forte Principal (De pus la lucru):</h3>
            <p>${puncteTare}</p>
        </div>
        <div class="result-section">
            <h3>Defectul/Bottleneck-ul de controlat:</h3>
            <p>${puncteSlab}</p>
        </div>
        <div style="font-size:0.85rem; line-height:1.4; color:var(--v1); text-align:center; font-style:italic; margin-top:20px;">
            "Matricea ta psihologică arată că ai deja toată infrastructura internă de manager. Tot ce te mai ține legată de fabrică sunt atașamentele sau alibiurile emoționale. Pune Punctul Forte la lucru."
        </div>
    `;
}

window.onload = initQuiz;
</script>
</body>
</html>
